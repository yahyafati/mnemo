name: Pages

# Publishes the download page and the privacy policy at https://yahyafati.github.io/mnemo/
# (sideload roadmap S4, release ROADMAP R4). Needs Settings › Pages › Source = "GitHub Actions" once.
# The build fails while the policy has no contact address, so an unfinished policy never goes live,
# and when the page's download table disagrees with the file names release.yml produces.
# The current version is read by the page in the visitor's browser, so a new release needs no redeploy.

on:
  push:
    branches: [main]
    paths:
      - docs/release/privacy-policy.md
      - docs/desktop/install.md          # the page's install notes are written from it
      - docs/release/assets/**           # icon and screenshots
      - scripts/pages/**
      - scripts/release/prepare-release.py   # the stable file names the page links to
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdown
      - run: python3 scripts/pages/build.py site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
