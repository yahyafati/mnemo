name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Build, test, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21 # runs Gradle; the JDK 25 test toolchain is downloaded by the foojay resolver
      - uses: gradle/actions/setup-gradle@v4
      - name: Phase exit check
        run: ./gradlew assembleDebug testDebugUnitTest lint
      - name: JVM module tests
        run: ./gradlew :core:ai:test :core:anki:test :core:model:test :core:scheduler:test :core:common:test
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-*.html

  # Unsigned: the upload key never leaves the owner's machine (docs/release/signing.md). This is
  # the same build F-Droid makes, and the 16 KB page-size check runs on its output.
  release-bundle:
    name: Unsigned release bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew bundleRelease assembleRelease
      - name: 16 KB page-size alignment
        run: |
          python3 scripts/check-16kb-alignment.py app/build/outputs/bundle/release/app-release.aab
          python3 scripts/check-16kb-alignment.py app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: release-unsigned
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt

  # The baselines are recorded on macOS. Font rasterization can differ on Linux, so this job
  # reports but does not block until the baselines are recorded on the CI image too.
  screenshots:
    name: Screenshot baselines
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew verifyRoborazziDebug
