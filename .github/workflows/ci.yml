name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Build, test, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21 # runs Gradle; the JDK 25 test toolchain is downloaded by the foojay resolver
      - uses: gradle/actions/setup-gradle@v4
      # The Kotlin Multiplatform modules (D4 on) have no testDebugUnitTest: their Android tests are
      # testAndroidHostTest (their desktop tests run in the desktop job below).
      - name: Phase exit check
        run: ./gradlew assembleDebug testDebugUnitTest testAndroidHostTest lint
      - name: JVM module tests
        run: ./gradlew :core:ai:test :core:anki:test :core:model:test :core:scheduler:test :core:common:test
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-*.html

  # Desktop (docs/desktop/ROADMAP.md, ADR 0010). The tests load the native libraries the desktop
  # app depends on (bundled SQLite, zstd, Skia) and run the shared data layer on the desktop
  # target (`desktopTest` in every Kotlin Multiplatform module, `:desktop:test` for the whole
  # collection flow), so this job runs on all three OSes; `:core:anki` reads real Anki packages
  # through zstd and SQLite too. The OS keychain test skips itself on runners that have none. The
  # installers are built per OS in D8; for now Linux builds the app image and checks the desktop
  # classpath for proprietary SDKs.
  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Skia's system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libxrender1 libxtst6 libxi6 libfontconfig1 libfreetype6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21 # runs Gradle and jlink/jpackage (needs jmods); tests use the JDK 25 toolchain
      - uses: gradle/actions/setup-gradle@v4
      - name: Desktop tests and native libraries
        run: ./gradlew desktopTest :desktop:test :core:anki:test
      - name: App image (Linux)
        if: runner.os == 'Linux'
        run: ./gradlew :desktop:createDistributable
      - name: FOSS-only dependencies (Linux)
        if: runner.os == 'Linux'
        run: ./gradlew -q :desktop:dependencies --configuration runtimeClasspath | python3 scripts/fdroid/check-foss-deps.py
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-reports-${{ runner.os }}
          path: |
            **/build/reports/tests/
            **/build/compose/logs/

  # Unsigned: the upload key never leaves the owner's machine (docs/release/signing.md). This is
  # the same build F-Droid makes, and the 16 KB page-size check runs on its output.
  release-bundle:
    name: Unsigned release bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew bundleRelease assembleRelease
      - name: FOSS-only dependencies (F-Droid)
        run: ./gradlew -q :app:dependencies --configuration releaseRuntimeClasspath | python3 scripts/fdroid/check-foss-deps.py
      - name: 16 KB page-size alignment
        run: |
          python3 scripts/check-16kb-alignment.py app/build/outputs/bundle/release/app-release.aab
          python3 scripts/check-16kb-alignment.py app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: release-unsigned
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt

  # Shared code may not import Android APIs (docs/desktop/ROADMAP.md, D3).
  android-imports:
    name: Android imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/desktop/check-android-imports.py

  # F-Droid reads its texts, changelog and graphics from the repo (docs/release/fdroid.md).
  fastlane:
    name: F-Droid metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fdroid/fastlane.py

  # The baselines are recorded on macOS. Font rasterization can differ on Linux, so this job
  # reports but does not block until the baselines are recorded on the CI image too.
  screenshots:
    name: Screenshot baselines
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew verifyRoborazziDebug verifyRoborazziAndroidHostTest verifyRoborazziDesktop
