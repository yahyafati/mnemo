name: Desktop release

# Builds the desktop installers (docs/desktop/ROADMAP.md, D8) on each system and attaches them, with
# SHA-256 checksums, to a *draft* GitHub Release for the tag. Nothing is published until the owner
# reads the draft and presses Publish. Run by hand (Actions > Desktop release > Run workflow), it only
# builds and keeps the installers as workflow artifacts: that is the way to try a change to the packaging.
#
# The installers are not signed (signing is "Later" in the roadmap): the release notes say what
# Windows SmartScreen and macOS Gatekeeper will show the first time.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Installers (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            tasks: :desktop:packageDeb :desktop:packageRpm :desktop:packagePortable
          - name: Windows
            os: windows-latest
            tasks: :desktop:packageMsi
          # Apple Silicon only (desktop ROADMAP D0). An Intel build needs an Intel runner: add a
          # `macos-15-intel` entry with the same task and an arch suffix in the staging step below.
          - name: macOS
            os: macos-latest
            tasks: :desktop:packageDmg
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: The tag is the version in gradle.properties
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^mnemo.versionName=//p' gradle.properties)
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match mnemo.versionName=$version in gradle.properties"
            exit 1
          fi

      - name: Packaging tools and Skia's system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot dpkg-dev binutils xvfb libgl1 libxrender1 libxtst6 libxi6 libfontconfig1 libfreetype6

      - name: WiX Toolset (Windows)
        if: runner.os == 'Windows'
        run: |
          # jpackage builds an MSI with WiX 3. The runner image has had it; install it if it does not.
          if ! command -v candle.exe >/dev/null 2>&1 && [ ! -d "/c/Program Files (x86)/WiX Toolset v3.14" ]; then
            choco install wixtoolset --no-progress -y
          fi
          echo "C:\Program Files (x86)\WiX Toolset v3.14\bin" >> "$GITHUB_PATH"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21 # runs Gradle and jlink/jpackage (needs jmods); the daemon toolchain is JDK 25
      - uses: gradle/actions/setup-gradle@v4

      - name: Build the app image and the installers
        run: ./gradlew :desktop:createDistributable ${{ matrix.tasks }}

      # The packaged app, before anyone installs it: it starts on this system, creates its database
      # (so the trimmed Java runtime has what the app needs) and takes a file from a second launch.
      - name: Smoke test the app image
        env:
          SKIKO_RENDER_API: SOFTWARE_COMPAT # no GPU on a runner
        run: |
          py=python3
          if [ "$RUNNER_OS" = "Windows" ]; then py=python; fi # the runner's Windows image has no python3 shim in every case
          smoke="$py scripts/desktop/smoke-test-app.py desktop/build/compose/binaries/main/app --open-file core/anki/src/test/resources/modern.apkg"
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a $smoke; else $smoke; fi

      - name: Name the files
        run: |
          version=$(sed -n 's/^mnemo.versionName=//p' gradle.properties)
          out=desktop/build/compose/binaries/main
          mkdir -p dist
          case "$RUNNER_OS" in
            Linux)
              cp "$out"/deb/*.deb "$out"/rpm/*.rpm "$out"/portable/*.tar.gz dist/ ;;
            Windows)
              cp "$out/msi/Mnemo-$version.msi" "dist/Mnemo-$version-windows-x64.msi" ;;
            macOS)
              cp "$out/dmg/Mnemo-$version.dmg" "dist/Mnemo-$version-macos-arm64.dmg" ;;
          esac
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release-logs-${{ matrix.name }}
          path: |
            desktop/build/compose/logs/
            **/build/reports/problems/

  # One draft release for the tag, with every installer and their checksums.
  release:
    name: Draft GitHub Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Attach to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The Android release may already have made this release: add to it, and don't touch its notes.
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --title "Mnemo $version" --notes-file docs/desktop/release-notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
