name: Idea
description: Suggest a feature or an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome. Mnemo is local-first and has no account or sync server, so some things will not fit,
        but it helps to know what people want. Search the open issues first.

        **Issues are public.** Do not paste your cards or any API key.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation or problem, before the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
    validations:
      required: false
  - type: dropdown
    id: system
    attributes:
      label: Where would you use it?
      multiple: true
      options:
        - Android
        - Windows
        - macOS
        - Linux
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you send
      options:
        - label: This issue contains no API key and none of my private cards.
          required: true
