<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 500" width="1024" height="500">
  <!-- Play feature graphic, 1024 x 500. Render: FONTCONFIG_FILE=<fonts.conf for core/designsystem/src/main/res/font> rsvg-convert feature-graphic.svg -o feature-graphic.png (see README.md). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C1A17"/>
      <stop offset="1" stop-color="#2B2670"/>
    </linearGradient>
    <clipPath id="phone"><rect x="0" y="0" width="230" height="510" rx="26"/></clipPath>
    <filter id="shadow" x="-20%" y="-10%" width="140%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/></filter>
  </defs>
  <rect width="1024" height="500" fill="url(#bg)"/>

  <!-- Logo tile and wordmark -->
  <g transform="translate(64 96) scale(1.1)">
    <rect width="100" height="100" rx="24" fill="#1C1A17" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1.5"/>
    <rect x="24" y="24" width="40" height="52" rx="8" fill="#F4F1EA" stroke="#E7E3D8" stroke-width="2" transform="rotate(-6 24 24)"/>
    <rect x="36" y="22" width="40" height="52" rx="8" fill="#4F46E5" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="2" transform="rotate(6 36 22)"/>
    <path d="M48 38L56 50L68 34" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="196" y="178" font-family="Newsreader, serif" font-size="84" fill="#F4F1EA">Mnemo</text>
  <text x="64" y="284" font-family="Newsreader, serif" font-size="40" fill="#F4F1EA">Remember more,</text>
  <text x="64" y="332" font-family="Newsreader, serif" font-size="40" fill="#F4F1EA">study less.</text>
  <text x="64" y="392" font-family="Hanken Grotesk, sans-serif" font-size="21" fill="#C3C0FF">Spaced repetition with FSRS. Private, offline,</text>
  <text x="64" y="420" font-family="Hanken Grotesk, sans-serif" font-size="21" fill="#C3C0FF">and open source. Optional AI card creation.</text>

  <!-- Two phones, bleeding off the bottom edge -->
  <g transform="translate(590 46) rotate(-4 115 250)" filter="url(#shadow)">
    <g clip-path="url(#phone)"><image xlink:href="screenshots/phone/03-study-cloze-light.png" width="230" height="511" preserveAspectRatio="xMidYMin slice"/></g>
  </g>
  <g transform="translate(790 82) rotate(3 115 250)" filter="url(#shadow)">
    <g clip-path="url(#phone)"><image xlink:href="screenshots/phone/01-home-light.png" width="230" height="511" preserveAspectRatio="xMidYMin slice"/></g>
  </g>
</svg>
