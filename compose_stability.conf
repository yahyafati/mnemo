// Classes the Compose compiler should treat as stable (ROADMAP Phase 6, performance).
// `:core:model` is a plain JVM module, so Compose can't see that its types are immutable data
// classes and would recompose every composable taking a Card or a StudyCard on each frame of the
// study loop. They are all `val`-only; keep it that way (a `var` or a mutable collection here
// would make this file lie). java.time values are immutable.
com.yahyafati.mnemo.core.model.**
java.time.Instant
java.time.Duration
java.time.LocalDate
java.time.LocalTime
